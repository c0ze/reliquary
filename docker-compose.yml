# Reliquary — turnkey self-hosted MCP memory server.
#
#   cp .env.example .env            # set your bearer tokens
#   cp config.example.yaml config.yaml
#   docker compose up -d            # qdrant + embedder (+ model pull) + app
#
# Three services: a Qdrant vector store, an embedding model (Ollama serving
# nomic-embed-text, multilingual, 768-dim), and the app (MCP + OAuth + mem0).
# No GPU and no chat LLM are required for MCP-only retrieval.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Not published — only the app talks to it over the compose network.

  # Embedding model. Ollama exposes an OpenAI-compatible /v1/embeddings endpoint
  # on port 11434; mem0's "openai" embedder provider points at it (see
  # config.example.yaml). Swap the model here AND `embedding_*dims` in
  # config.yaml together if you change embedders.
  embedder:
    image: ollama/ollama:0.30.0
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pull the embedding model into the shared volume, then exit.
  embedder-pull:
    image: ollama/ollama:0.30.0
    depends_on:
      embedder:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "embedder:11434"
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      embedder:
        condition: service_healthy
      embedder-pull:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ${BLOB_HOST_DIR:-./data/blobs}:/data/blobs
    # Publish to loopback only; put Cloudflare Tunnel / Caddy / Traefik in front
    # for public TLS. Remove the 127.0.0.1 prefix at your own risk.
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  qdrant_storage:
  ollama_models:
