[project]
name = "reliquary"
version = "0.5.1"
description = "A personal memory server for AIs — Mem0 + Qdrant behind MCP, for Claude and ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mem0ai==2.0.4",
    "qdrant-client==1.18.0",
    "httpx==0.28.1",
    "uvicorn==0.48.0",
    "PyYAML==6.0.3",
    "h2==4.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
