[project]
name = "reliquary"
version = "0.1.0"
description = "A personal memory server for AIs — Mem0 + Qdrant behind MCP, for Claude and ChatGPT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mem0ai>=0.1.0",
    "qdrant-client>=1.7.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
