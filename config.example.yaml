# Mem0 config for Reliquary. Copy to config.yaml (gitignored) and adjust.
# Service hostnames (qdrant, embedder) are the docker-compose service names.

vector_store:
  provider: qdrant
  config:
    host: qdrant
    port: 6333
    # Must match your embedding model's output dimensionality.
    embedding_model_dims: 768

embedder:
  # Ollama exposes an OpenAI-compatible /v1/embeddings endpoint, so mem0's
  # "openai" provider can point straight at it (no extra Python dependency).
  provider: openai
  config:
    model: nomic-embed-text
    openai_base_url: http://embedder:11434/v1
    api_key: ollama          # unused by Ollama, but the client requires a value
    embedding_dims: 768

# mem0 instantiates an LLM client at startup even in MCP-only mode
# (--no-chat-upstream, infer=false), so it needs *a* valid llm section. It is
# never actually called for search/fetch/add, so pointing it at the embedder
# endpoint with a dummy key is enough. Replace with a real LLM only if you
# enable chat completions or infer=true writes.
llm:
  provider: openai
  config:
    model: nomic-embed-text
    openai_base_url: http://embedder:11434/v1
    api_key: ollama
