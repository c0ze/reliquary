name: Tests

# Runs on pull requests, and is called by docker-publish.yml before anything is
# published, so every push to main or v* tag is gated on it.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The same pinned set the Docker image installs, so the suite (including
      # the Mem0 signature contract test) runs against what ships.
      - name: Install the locked runtime set and test tools
        run: python -m pip install -r requirements.lock pytest==9.2.0 uv==0.13.4
      - name: Run tests
        run: python -m pytest -q
      - name: Byte-compile the app
        run: python -m compileall -q app
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Audit requirements.lock
        run: uvx pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Audit what uv.lock resolves
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/uv-requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/uv-requirements.txt" --no-deps --disable-pip
      - name: Build the image
        run: docker build -t reliquary:ci .
